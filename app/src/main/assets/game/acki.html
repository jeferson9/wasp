<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Acki City — Chain Runner</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
    html,body { width:100%; height:100%; overflow:hidden; background:#04050a; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; color:#e8ecf5; }
    #gl { position:fixed; inset:0; }

    /* ── HUD ─────────────────────────── */
    .hud { position:fixed; z-index:10; pointer-events:none; }
    #hudTop { top:calc(8px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .hud-pill { background:rgba(6,8,14,.72); border:1px solid rgba(120,140,200,.22); border-radius:14px; padding:7px 12px; backdrop-filter:blur(6px); }
    #epochPill { min-width:118px; }
    #epochLbl { font-size:10px; letter-spacing:1.5px; color:#8fa2c9; font-weight:800; }
    #epochNum { font-size:16px; font-weight:900; color:#fff; }
    #timerBar { height:5px; border-radius:3px; background:rgba(255,255,255,.12); margin-top:5px; overflow:hidden; }
    #timerFill { height:100%; width:100%; border-radius:3px; background:linear-gradient(90deg,#37d67a,#a8ff9e); transition:width .3s linear; }
    #timerFill.danger { background:linear-gradient(90deg,#ff3b3b,#ff8a5c); }
    #quotaPill { text-align:center; }
    #quotaLbl { font-size:10px; letter-spacing:1.5px; color:#8fa2c9; font-weight:800; }
    #quotaVal { font-size:19px; font-weight:900; color:#7dffab; text-shadow:0 0 12px rgba(55,214,122,.7); }
    #rightPills { display:flex; gap:8px; align-items:center; pointer-events:auto; }
    #wpPill { text-align:center; }
    #wpLbl { font-size:10px; letter-spacing:1.5px; color:#8fa2c9; font-weight:800; }
    #wpVal { font-size:16px; font-weight:900; color:#ffd400; text-shadow:0 0 10px rgba(255,212,0,.55); }
    #pauseBtn { width:42px; height:42px; border-radius:13px; background:rgba(6,8,14,.72); border:1px solid rgba(120,140,200,.25); color:#cfd8ee; font-size:17px; font-weight:900; pointer-events:auto; }
    #comboTag { position:fixed; top:calc(64px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); font-size:13px; font-weight:900; color:#ffd400; text-shadow:0 0 12px rgba(255,212,0,.6); opacity:0; transition:opacity .25s; z-index:10; pointer-events:none; }

    /* botão CORRER (esquerda) — segure para a Acki correr pra frente */
    #runBtn { position:fixed; left:26px; bottom:calc(30px + env(safe-area-inset-bottom)); width:96px; height:96px; border-radius:50%; z-index:10;
        background:radial-gradient(circle at 35% 30%,rgba(80,225,140,.9),rgba(15,110,60,.92)); border:3px solid rgba(120,255,180,.55);
        color:#03230f; font-weight:900; font-size:14px; letter-spacing:1px; box-shadow:0 0 22px rgba(55,214,122,.35); }
    #runBtn.held { transform:scale(.93); box-shadow:0 0 34px rgba(55,214,122,.65); }
    #steerHint { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); z-index:9; font-size:10px; font-weight:800; letter-spacing:1px; color:rgba(160,180,220,.55); pointer-events:none; }

    /* dash */
    #dashBtn { position:fixed; right:26px; bottom:calc(30px + env(safe-area-inset-bottom)); width:86px; height:86px; border-radius:50%; z-index:10;
        background:radial-gradient(circle at 35% 30%,rgba(255,90,90,.9),rgba(140,20,30,.9)); border:3px solid rgba(255,120,120,.55);
        color:#fff; font-weight:900; font-size:14px; letter-spacing:1px; box-shadow:0 0 22px rgba(255,60,60,.35); }
    #dashBtn:active { transform:scale(.93); }
    #dashBtn.cd { filter:grayscale(.8); opacity:.55; }
    #carryTag { position:fixed; right:30px; bottom:calc(232px + env(safe-area-inset-bottom)); z-index:10; font-size:12px; font-weight:900; color:#7dffab; text-shadow:0 0 10px rgba(55,214,122,.6); pointer-events:none; text-align:center; width:80px; }
    #vehTag { position:fixed; left:34px; bottom:calc(140px + env(safe-area-inset-bottom)); z-index:10; font-size:13px; font-weight:900; color:#8fd8ff; text-shadow:0 0 10px rgba(90,180,255,.6); pointer-events:none; }
    #minimap { position:fixed; left:12px; top:calc(86px + env(safe-area-inset-top)); z-index:9; width:126px; height:126px;
        border-radius:14px; border:1px solid rgba(120,140,200,.3); background:rgba(6,8,14,.55); pointer-events:none; display:none; }

    /* ataque (aparece quando a Acki está armada) */
    #atkBtn { position:fixed; right:32px; bottom:calc(134px + env(safe-area-inset-bottom)); width:74px; height:74px; border-radius:50%; z-index:10;
        background:radial-gradient(circle at 35% 30%,rgba(130,200,255,.92),rgba(25,60,130,.92)); border:3px solid rgba(150,220,255,.55);
        font-size:30px; line-height:1; box-shadow:0 0 20px rgba(90,170,255,.35); }
    #atkBtn:active { transform:scale(.92); }
    #atkUses { position:absolute; top:-6px; right:-6px; background:#ffd400; color:#3a2b00; font-size:11px; font-weight:900; border-radius:999px; padding:2px 7px; box-shadow:0 2px 6px rgba(0,0,0,.4); }

    /* verify ring */
    #verifyWrap { position:fixed; left:50%; bottom:24%; transform:translateX(-50%); z-index:10; display:none; text-align:center; pointer-events:none; }
    #verifyRing { width:74px; height:74px; border-radius:50%; margin:0 auto 6px; background:conic-gradient(#37d67a 0deg, rgba(255,255,255,.12) 0deg); display:flex; align-items:center; justify-content:center; }
    #verifyRing > div { width:56px; height:56px; border-radius:50%; background:rgba(5,7,12,.85); display:flex; align-items:center; justify-content:center; font-size:22px; }
    #verifyTxt { font-size:12px; font-weight:900; letter-spacing:2px; color:#7dffab; text-shadow:0 0 10px rgba(55,214,122,.7); }

    /* center popups */
    #popup { position:fixed; left:50%; top:34%; transform:translate(-50%,-50%) scale(.6); z-index:12; font-size:30px; font-weight:900; letter-spacing:2px;
        opacity:0; pointer-events:none; text-shadow:0 0 24px currentColor; transition:all .28s cubic-bezier(.2,1.6,.4,1); }
    #popup.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #hint { position:fixed; left:50%; bottom:16%; transform:translateX(-50%); z-index:10; font-size:13px; font-weight:700; color:#cdd8f2;
        background:rgba(6,8,14,.7); border:1px solid rgba(120,140,200,.25); border-radius:12px; padding:8px 16px; opacity:0; transition:opacity .4s; pointer-events:none; max-width:86%; text-align:center; }

    /* damage flash + vignette + relâmpago */
    #flash { position:fixed; inset:0; z-index:20; background:radial-gradient(circle,transparent 40%,rgba(255,20,30,.55)); opacity:0; pointer-events:none; transition:opacity .5s; }
    #bolt { position:fixed; inset:0; z-index:19; background:rgba(222,232,255,.92); opacity:0; pointer-events:none; }
    #vig { position:fixed; inset:0; z-index:5; pointer-events:none; background:radial-gradient(circle,transparent 62%,rgba(0,0,5,.55)); }

    /* ── overlays (title / win / fail / pause) ── */
    .ovl { position:fixed; inset:0; z-index:30; background:rgba(3,4,9,.88); backdrop-filter:blur(8px); display:none; align-items:center; justify-content:center; }
    .ovl.show { display:flex; }
    .ovl-card { width:min(480px,92%); max-height:92%; overflow-y:auto; text-align:center; padding:22px 26px; border-radius:22px;
        background:linear-gradient(160deg,rgba(16,20,36,.95),rgba(8,10,18,.95)); border:1px solid rgba(130,150,220,.22); box-shadow:0 20px 60px rgba(0,0,0,.6); }
    .g-logo { font-size:34px; font-weight:900; font-style:italic; letter-spacing:1px; line-height:1.05;
        background:linear-gradient(90deg,#ff4b4b,#ffb35c 45%,#37d67a); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(255,80,80,.35)); }
    .g-sub { font-size:11px; letter-spacing:3px; font-weight:800; color:#8fa2c9; margin-top:4px; }
    .g-lore { font-size:12.5px; line-height:1.55; color:#aeb9d6; margin:14px 0; text-align:left; background:rgba(255,255,255,.04); border-radius:12px; padding:11px 13px; border:1px solid rgba(255,255,255,.06); }
    .g-lore b.r { color:#ff6b6b; } .g-lore b.g { color:#5dff9d; } .g-lore b.y { color:#ffd400; }
    .g-stats { display:flex; gap:8px; justify-content:center; margin:12px 0; flex-wrap:wrap; }
    .g-stat { flex:1; min-width:90px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px 6px; }
    .g-stat b { display:block; font-size:17px; color:#fff; }
    .g-stat span { font-size:9.5px; letter-spacing:1px; color:#8fa2c9; font-weight:800; }
    .g-btn { display:block; width:100%; margin-top:10px; padding:14px; border-radius:14px; border:none; font-size:15px; font-weight:900; letter-spacing:1px; }
    .g-btn.main { background:linear-gradient(90deg,#1fae5e,#37d67a); color:#04220f; box-shadow:0 6px 22px rgba(55,214,122,.35); }
    .g-btn.main:active { transform:scale(.97); }
    .g-btn.ghost { background:rgba(255,255,255,.07); color:#cfd8ee; border:1px solid rgba(255,255,255,.14); }
    .g-wpwin { font-size:26px; font-weight:900; color:#ffd400; text-shadow:0 0 18px rgba(255,212,0,.5); margin:6px 0; }
    .g-cap { font-size:11px; color:#ff9d6b; margin-top:6px; }
    .g-note { font-size:10.5px; color:#7c88a8; margin-top:10px; }
    #winTitle { font-size:26px; font-weight:900; color:#5dff9d; text-shadow:0 0 20px rgba(55,214,122,.55); }
    #failTitle { font-size:24px; font-weight:900; color:#ff5c5c; text-shadow:0 0 20px rgba(255,60,60,.5); }
    .howto { text-align:left; font-size:12.5px; line-height:1.7; color:#aeb9d6; }
    .howto b { color:#e8ecf5; }

    #loadTag { position:fixed; inset:0; z-index:40; background:#05060c; display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:14px; }
    #loadTag .g-logo { font-size:30px; }
    #loadBarWrap { width:200px; height:6px; border-radius:3px; background:rgba(255,255,255,.1); overflow:hidden; }
    #loadBarFill { height:100%; width:8%; border-radius:3px; background:linear-gradient(90deg,#37d67a,#a8ff9e); transition:width .25s ease; }
    #loadTxt { font-size:11px; letter-spacing:1.5px; font-weight:800; color:#8fa2c9; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="bolt"></div>
<div id="loadTag">
    <div class="g-logo">ACKI CITY</div>
    <div id="loadBarWrap"><div id="loadBarFill"></div></div>
    <div id="loadTxt">CARREGANDO CIDADE…</div>
</div>

<!-- HUD -->
<div class="hud" id="hudTop" style="display:none;">
    <div class="hud-pill" id="epochPill">
        <div id="epochLbl">EPOCH</div>
        <div id="epochNum">1</div>
        <div id="timerBar"><div id="timerFill"></div></div>
    </div>
    <div class="hud-pill" id="quotaPill">
        <div id="quotaLbl">FINALIDADE</div>
        <div id="quotaVal">0 / 5</div>
    </div>
    <div id="rightPills">
        <div class="hud-pill" id="wpPill">
            <div id="wpLbl">WP</div>
            <div id="wpVal">+0</div>
        </div>
        <button id="pauseBtn">❚❚</button>
    </div>
</div>
<div id="comboTag"></div>
<button id="runBtn" style="display:none;">🏃 CORRER</button>
<div id="steerHint" style="display:none;">⟲ ⟳</div>
<button id="dashBtn" style="display:none;">DASH</button>
<button id="atkBtn" style="display:none;"><span id="atkEmoji">⚔️</span><span id="atkUses">0</span></button>
<div id="carryTag" style="display:none;"></div>
<div id="vehTag"></div>
<canvas id="minimap" width="126" height="126"></canvas>
<div id="verifyWrap"><div id="verifyRing"><div>🔍</div></div><div id="verifyTxt">VERIFICANDO…</div></div>
<div id="popup"></div>
<div id="hint"></div>

<!-- TITLE -->
<div class="ovl show" id="ovlTitle"><div class="ovl-card">
    <div class="g-logo">ACKI CITY</div>
    <div class="g-sub" id="tSub">CHAIN RUNNER • REDE ACKI NACKI</div>
    <div class="g-lore" id="tLore"></div>
    <div class="g-stats">
        <div class="g-stat"><b id="tEpoch">1</b><span id="tEpochLbl">EPOCH ATUAL</span></div>
        <div class="g-stat"><b id="tBest">0</b><span id="tBestLbl">MELHOR</span></div>
        <div class="g-stat"><b id="tToday">0</b><span id="tTodayLbl">WP HOJE</span></div>
    </div>
    <button class="g-btn main" id="btnPlay">▶ JOGAR — EPOCH 1</button>
    <button class="g-btn ghost" id="btnHow">COMO JOGAR</button>
    <button class="g-btn ghost" id="btnExitTitle">SAIR</button>
    <div class="g-note" id="tNote"></div>
</div></div>

<!-- HOW TO -->
<div class="ovl" id="ovlHow"><div class="ovl-card">
    <div class="g-logo" style="font-size:22px;" id="howTitle">COMO JOGAR</div>
    <div class="g-lore howto" id="howBody"></div>
    <button class="g-btn main" id="btnHowBack">OK!</button>
</div></div>

<!-- WIN -->
<div class="ovl" id="ovlWin"><div class="ovl-card">
    <div id="winTitle">⛓ EPOCH FINALIZADA!</div>
    <div class="g-wpwin" id="winWp">+0 WP</div>
    <div class="g-stats">
        <div class="g-stat"><b id="winBlocks">0</b><span id="winBlocksLbl">BLOCOS</span></div>
        <div class="g-stat"><b id="winCombo">0</b><span id="winComboLbl">MAIOR COMBO</span></div>
        <div class="g-stat"><b id="winTime">0s</b><span id="winTimeLbl">TEMPO RESTANTE</span></div>
    </div>
    <div class="g-cap" id="winCap" style="display:none;"></div>
    <button class="g-btn main" id="btnNext">▶ PRÓXIMA EPOCH</button>
    <button class="g-btn ghost" id="btnWinExit">SAIR</button>
    <div class="g-note" id="winNote"></div>
</div></div>

<!-- FAIL -->
<div class="ovl" id="ovlFail"><div class="ovl-card">
    <div id="failTitle">✖ EPOCH EXPIRADA</div>
    <div class="g-lore" id="failLore"></div>
    <div class="g-stats">
        <div class="g-stat"><b id="failBlocks">0</b><span id="failBlocksLbl">BLOCOS</span></div>
        <div class="g-stat"><b id="failQuota">5</b><span id="failQuotaLbl">META</span></div>
    </div>
    <button class="g-btn main" id="btnRetry">↻ TENTAR DE NOVO</button>
    <button class="g-btn ghost" id="btnFailExit">SAIR</button>
</div></div>

<!-- PAUSE -->
<div class="ovl" id="ovlPause"><div class="ovl-card">
    <div class="g-logo" style="font-size:22px;" id="pauseTitle">PAUSADO</div>
    <button class="g-btn main" id="btnResume">▶ CONTINUAR</button>
    <button class="g-btn ghost" id="btnSound">🔊 SOM: ON</button>
    <button class="g-btn ghost" id="btnPauseExit">SAIR DO JOGO</button>
</div></div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
"use strict";

   ACKI CITY — Chain Runner (WASP / rede Acki Nacki)
   A cidade é a blockchain. Blocos vermelhos = blocos maliciosos
   ("Nack"). Acki é a Verificadora: verifica blocos (Ack → verde)
   e entrega ao Block Keeper para atestação/finalidade. Cada fase
   é uma Epoch; finalizar a Epoch paga WP reais no WASP.

async function loadAllModels(onProgress) {
  const buildingFiles = ["building-a","building-b","building-c","building-d","building-e","building-f","building-g",
    "building-skyscraper-a","building-skyscraper-b","building-skyscraper-c","building-skyscraper-d","building-skyscraper-e"];
  const carFiles = { taxi:"taxi", sedan:"sedan", suv:"suv", suvLuxury:"suv-luxury", hatch:"hatchback-sports",
    ambulance:"ambulance", police:"police", delivery:"delivery" };
  // sword fica em subpasta própria: seu colormap.png (pacote mini-dungeon)
  // não pode dividir a mesma pasta do colormap.png do blaster-kit (pistol/rifle)
  const weaponFiles = { pistol:"models/weapons/pistol.glb", rifle:"models/weapons/rifle.glb",
    sword:"models/weapons/sword/sword.glb" };

  const bKeys = buildingFiles;
  const cKeys = Object.keys(carFiles);
  const wKeys = Object.keys(weaponFiles);
  const jobs = [
    ...bKeys.map(f => ({ kind: "b", key: f, path: "models/city/" + f + ".glb" })),
    ...cKeys.map(k => ({ kind: "c", key: k, path: "models/cars/" + carFiles[k] + ".glb" })),
    ...wKeys.map(k => ({ kind: "w", key: k, path: weaponFiles[k] }))
  ];
  let done = 0;
  await Promise.all(jobs.map(job => loadGLB(job.path).then(scene => {
    if (scene) {
      if (job.kind === "b") MODELS.buildings.push(scene);
      else if (job.kind === "c") MODELS.cars[job.key] = scene;
      else MODELS.weapons[job.key] = scene;
    }
    done++;
    if (onProgress) onProgress(done / jobs.length);
  })));
}

   recentra a base em y=0 e o centro em x/z=0 (mesma convenção dos veículos
   procedurais, que são montados centrados na origem) */
function prepCarClone(src, targetLen) {
  const clone = src.clone(true);
  clone.traverse(o => { if (o.isMesh) o.castShadow = true; });
  const box1 = new THREE.Box3().setFromObject(clone);
  const size1 = new THREE.Vector3(); box1.getSize(size1);
  const scale = (targetLen || 2.3) / Math.max(size1.x, size1.z, .001);
  clone.scale.setScalar(scale);
  const box2 = new THREE.Box3().setFromObject(clone);
  clone.position.x -= (box2.min.x + box2.max.x) / 2;
  clone.position.z -= (box2.min.z + box2.max.z) / 2;
  clone.position.y -= box2.min.y;
  return clone;
}

    for (let i = 6; i < 122; i += 12) {

        x.fillStyle = col;

    // distritos: cada quadrante da cidade puxa um tom de janela diferente
    const q = cx < 0 ? (cz < 0 ? 0 : 1) : (cz < 0 ? 2 : 3);
    const tex = winTex[Math.random() < .35 ? (Math.random()*6)|0 : q];
    // paredes com janelas; teto/base de concreto escuro (senão as janelas
    // "vazam" para o topo do prédio)
    const wallM = new THREE.MeshLambertMaterial({ color: 0x151824, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: .85, map: tex });
    const roofM = new THREE.MeshLambertMaterial({ color: 0x11141d });
    const b = new THREE.Mesh(boxG, [wallM, wallM, roofM, roofM, wallM, wallM]);
    b.scale.set(w, h, d);
    b.position.set(cx, y0 + h/2, cz);
    b.userData.fadeMats = [wallM, roofM];
    scene.add(b);
    buildings.push(b);
    return b;
  }
  function trim(cx, cz, w, d, y) {
    const m = new THREE.Mesh(boxG, trimM.clone());
    m.scale.set(w + .5, .5, d + .5);
    m.position.set(cx, y, cz);
    m.userData.fadeMats = [m.material];
    scene.add(m);
    buildings.push(m);
  }

  // lotes reservados para os parques (sem prédios)
  const PARK_LOTS = new Set(["-4,1","-4,2","-3,1","-3,2","2,-4","2,-3","3,-4","3,-3"]);
  for (let i = -GRID; i < GRID; i++) for (let j = -GRID; j < GRID; j++) {
    const cx = i*CELL + CELL/2, cz = j*CELL + CELL/2;
    if (Math.hypot(cx, cz) < 22) continue;               // praça central livre
    if (PARK_LOTS.has(i + "," + j)) continue;            // área de parque
    if (i === 1 && j === 1) continue;                    // lote do M Burger
    if (Math.random() < .16) continue;                   // lotes vazios
    const w = 9 + Math.random()*3, d = 9 + Math.random()*3;
    const roll = Math.random();
    let topH = 0, topW = w, topD = d;                    // altura/limite do topo p/ props

    if (roll < .40) {                                    // torre simples
      topH = 10 + Math.random()*20;
      if (MODELS.buildings.length && Math.random() < .55) placeGLBBuilding(cx, cz, w, topH, d);
      else tier(cx, cz, w, topH, d, 0);
    } else if (roll < .72) {                             // torre em camadas (setbacks)
      const h1 = 8 + Math.random()*7;
      tier(cx, cz, w, h1, d, 0);
      trim(cx, cz, w, d, h1 + .2);
      const w2 = w*.72, d2 = d*.72, h2 = 6 + Math.random()*8;
      tier(cx, cz, w2, h2, d2, h1 + .45);
      topH = h1 + .45 + h2; topW = w2; topD = d2;
      if (Math.random() < .5) {
        trim(cx, cz, w2, d2, topH + .2);
        const w3 = w*.48, d3 = d*.48, h3 = 4 + Math.random()*7;
        tier(cx, cz, w3, h3, d3, topH + .45);
        topH = topH + .45 + h3; topW = w3; topD = d3;
      }
    } else if (roll < .87) {                             // torre com spire/antena
      topH = 14 + Math.random()*18;
      tier(cx, cz, w, topH, d, 0);
      const ant = new THREE.Mesh(boxG, trimM);
      ant.scale.set(.22, 4.5, .22);
      ant.position.set(cx, topH + 2.2, cz);
      scene.add(ant);
      const tip = glowSprite("rgba(255,60,60,.9)", 1.6);
      tip.position.set(cx, topH + 4.6, cz);
      scene.add(tip);
      blinkers.push({ s: tip, ph: Math.random()*6 });
    } else {                                             // comercial baixo e largo
      topH = 5 + Math.random()*3;
      tier(cx, cz, w + 1.5, topH, d + 1.5, 0);
      topW = w + 1.5; topD = d + 1.5;
    }

    // térreo com lojas (vitrines) nas torres + parapeito no topo
    if (roll < .87) {
      if (Math.random() < .6) {
        const sm2 = storeMats[(Math.random()*4)|0];
        const gf = new THREE.Mesh(boxG, [sm2, sm2, storeTop, storeTop, sm2, sm2]);
        gf.scale.set(w + .9, 3, d + .9);
        gf.position.set(cx, 1.5, cz);
        scene.add(gf);
      }
      trim(cx, cz, topW - .3, topD - .3, topH + .15);
    }

    // props de telhado: caixa d'água ou ar-condicionado
    if (Math.random() < .38) {
      if (Math.random() < .5) {
        const t = new THREE.Mesh(tankG, tankM);
        t.position.set(cx + (Math.random()-.5)*topW*.4, topH + .8, cz + (Math.random()-.5)*topD*.4);
        scene.add(t);
      } else {
        const ac = new THREE.Mesh(boxG, trimM);
        ac.scale.set(1.6, .9, 1.2);
        ac.position.set(cx + (Math.random()-.5)*topW*.4, topH + .45, cz + (Math.random()-.5)*topD*.4);
        scene.add(ac);
      }
    }
    // faixa neon no topo
    if (Math.random() < .32) {
      const ec = [0xff3b3b, 0x37d67a, 0x9b7cff][(Math.random()*3)|0];
      const e = new THREE.Mesh(new THREE.BoxGeometry(topW + .3, .3, topD + .3), new THREE.MeshBasicMaterial({ color: ec }));
      e.position.set(cx, topH + .15, cz);
      scene.add(e);
    }
    // letreiro neon vertical na fachada
    if (Math.random() < .32 && topH >= 11) {
      const col = SIGN_COL[(Math.random()*SIGN_COL.length)|0];
      const sm = new THREE.MeshBasicMaterial({ map: signTexture(SIGN_TXT[(Math.random()*SIGN_TXT.length)|0], col), transparent: true, side: THREE.DoubleSide });
      const sp = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 6), sm);
      const face = (Math.random()*4)|0;                  // 0=+x 1=-x 2=+z 3=-z
      const sy = Math.min(topH - 3.4, 4 + Math.random()*4) + 3;
      if (face === 0)      { sp.position.set(cx + w/2 + .12, sy, cz + (Math.random()-.5)*d*.5); sp.rotation.y =  Math.PI/2; }
      else if (face === 1) { sp.position.set(cx - w/2 - .12, sy, cz + (Math.random()-.5)*d*.5); sp.rotation.y = -Math.PI/2; }
      else if (face === 2) { sp.position.set(cx + (Math.random()-.5)*w*.5, sy, cz + d/2 + .12); }
      else                 { sp.position.set(cx + (Math.random()-.5)*w*.5, sy, cz - d/2 - .12); sp.rotation.y = Math.PI; }
      scene.add(sp);
      signs.push({ m: sm, on: true, next: 1 + Math.random()*4 });
    }
    // parede candidata a "fluxo de dados" (blockchain subindo o prédio)
    if (wallSpots.length < 40) {
      const fx = Math.random() < .5 ? cx + w/2 + .1 : cx - w/2 - .1;
      wallSpots.push({ x: fx, z: cz + (Math.random()-.5)*d*.6, h: Math.max(8, topH) });
    }

    colliders.push({ minX: cx - w/2 - .5, maxX: cx + w/2 + .5, minZ: cz - d/2 - .5, maxZ: cz + d/2 + .5 });
  }
}

/* ── PERIFERIA (oeste): barracos com zinco, sobrados, varais e postes ── */
{
  const dirt = new THREE.Mesh(new THREE.PlaneGeometry(46, BZ*2),
    new THREE.MeshLambertMaterial({ color: 0x171310 }));
  dirt.rotation.x = -Math.PI/2; dirt.position.set(-117, .035, 0); scene.add(dirt);
  // textura de reboco com remendos de tijolo e manchas (tingida pela cor da casa)
  function plasterTexture() {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const x = c.getContext("2d");
    x.fillStyle = "#b8b0a4"; x.fillRect(0, 0, 64, 64);
    for (let n = 0; n < 30; n++) {                       // manchas de umidade
      x.fillStyle = "rgba(60,50,40," + (Math.random()*.25) + ")";
      x.fillRect(Math.random()*64, Math.random()*64, 4 + Math.random()*10, 3 + Math.random()*8);
    }
    const bx0 = Math.random()*30, by0 = 30 + Math.random()*20;   // remendo de tijolo exposto
    x.fillStyle = "#8a4a34"; x.fillRect(bx0, by0, 26, 16);
    x.strokeStyle = "#6a3424"; x.lineWidth = 1;
    for (let ry = by0; ry < by0 + 16; ry += 4) { x.beginPath(); x.moveTo(bx0, ry); x.lineTo(bx0 + 26, ry); x.stroke(); }
    return new THREE.CanvasTexture(c);
  }
  const plasterTex = [plasterTexture(), plasterTexture(), plasterTexture()];
  const wallCols = [0xc27a5a, 0x8aa06a, 0x6a8ab2, 0xc2a45a, 0xa06a9a, 0xb2926a];
  const zincM  = new THREE.MeshLambertMaterial({ color: 0x6a7080 });
  const winP   = new THREE.MeshLambertMaterial({ color: 0x1a1206, emissive: 0xffc96a, emissiveIntensity: .8 });
  const doorP  = new THREE.MeshLambertMaterial({ color: 0x2a1c10 });
  const tankP  = new THREE.MeshLambertMaterial({ color: 0x2a5a8a });
  const poleP  = new THREE.MeshLambertMaterial({ color: 0x3a3226 });
  const wireP  = new THREE.MeshLambertMaterial({ color: 0x0a0a0c });

  function barraco(hx, hz) {
    const w = 4.2 + Math.random()*1.8, d = 4.2 + Math.random()*1.8, h = 2.6 + Math.random()*1;
    const wallCol = wallCols[(Math.random()*wallCols.length)|0];
    const wallM = new THREE.MeshLambertMaterial({ color: wallCol, map: plasterTex[(Math.random()*3)|0] });
    const casa = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallM);
    casa.position.set(hx, h/2, hz); casa.castShadow = true; scene.add(casa);
    // porta + janela na frente
    const door = new THREE.Mesh(new THREE.BoxGeometry(.7, 1.4, .08), doorP);
    door.position.set(hx - w*.22, .7, hz + d/2 + .04); scene.add(door);
    const win = new THREE.Mesh(new THREE.BoxGeometry(.7, .55, .07), winP);
    win.position.set(hx + w*.22, h*.55, hz + d/2 + .04); scene.add(win);
    let topY = h;
    if (Math.random() < .45) {                           // sobrado: puxadinho em cima
      const w2 = w*.72, d2 = d*.72, h2 = 2 + Math.random()*.6;
      const wallM2b = new THREE.MeshLambertMaterial({ color: new THREE.Color(wallCol).multiplyScalar(.85), map: plasterTex[(Math.random()*3)|0] });
      const up = new THREE.Mesh(new THREE.BoxGeometry(w2, h2, d2), wallM2b);
      up.position.set(hx - (w - w2)/2, h + h2/2, hz - (d - d2)/2);
      up.castShadow = true; scene.add(up);
      const win2 = new THREE.Mesh(new THREE.BoxGeometry(.6, .5, .07), winP);
      win2.position.set(hx - (w - w2)/2, h + h2*.55, hz - (d - d2)/2 + d2/2 + .04); scene.add(win2);
      // laje que sobrou vira varanda (no tom da casa)
      const laje = new THREE.Mesh(new THREE.BoxGeometry(w + .3, .14, d + .3),
        new THREE.MeshLambertMaterial({ color: new THREE.Color(wallCol).multiplyScalar(.5) }));
      laje.position.set(hx, h + .07, hz); scene.add(laje);
      // zinco inclinado no puxadinho
      const roof2 = new THREE.Mesh(new THREE.BoxGeometry(w2 + .8, .07, d2 + 1), zincM);
      roof2.position.set(hx - (w - w2)/2, h + h2 + .18, hz - (d - d2)/2);
      roof2.rotation.x = .1 + Math.random()*.06; scene.add(roof2);
      topY = h + h2;
    } else {
      // telhado de zinco inclinado, sobrando nas beiradas
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w + .9, .07, d + 1.2), zincM);
      roof.position.set(hx, h + .22, hz);
      roof.rotation.x = .1 + Math.random()*.07;
      roof.castShadow = true; scene.add(roof);
    }
    if (Math.random() < .3) {
      const t2 = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, .65, 8), tankP);
      t2.position.set(hx + w*.22, topY + .5, hz); scene.add(t2);
    }
    colliders.push({ minX: hx - w/2 - .4, maxX: hx + w/2 + .4, minZ: hz - d/2 - .4, maxZ: hz + d/2 + .4 });
  }
  for (let row = -4; row <= 4; row++) for (let col = 0; col < 3; col++) {
    const hz = row*17 + (Math.random() - .5)*3;
    if (Math.abs(hz) < 7) continue;                      // rua de entrada (z≈0)
    barraco(-132 + col*13 + (Math.random() - .5)*2, hz);
  }
  // varais de roupa entre os barracos
  const clothCols = [0xc23a3a, 0x3a7ac2, 0xe8e4d8, 0xc2952e];
  for (let n = 0; n < 5; n++) {
    const vx = -128 + Math.random()*24, vz = (Math.random()*2 - 1)*76;
    if (insideBuilding(vx, vz, 1) || insideBuilding(vx + 3, vz, 1)) continue;
    [0, 3].forEach(off => {
      const p3 = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, 1.7, 5), poleP);
      p3.position.set(vx + off, .85, vz); scene.add(p3);
    });
    const line = new THREE.Mesh(new THREE.BoxGeometry(3, .02, .02), wireP);
    line.position.set(vx + 1.5, 1.62, vz); scene.add(line);
    for (let k = 0; k < 3; k++) {
      const cloth = new THREE.Mesh(new THREE.PlaneGeometry(.5, .55),
        new THREE.MeshLambertMaterial({ color: clothCols[(Math.random()*4)|0], side: THREE.DoubleSide }));
      cloth.position.set(vx + .7 + k*.85, 1.33, vz); scene.add(cloth);
    }
  }
  // postes de madeira com fios
  const poleTops = [];
  [[-126, -50], [-118, 0], [-126, 50]].forEach(p4 => {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(.09, .12, 5, 6), poleP);
    pole.position.set(p4[0], 2.5, p4[1]); pole.castShadow = true; scene.add(pole);
    const cross = new THREE.Mesh(new THREE.BoxGeometry(1.1, .08, .08), poleP);
    cross.position.set(p4[0], 4.6, p4[1]); scene.add(cross);
    poleTops.push(p4);
    colliders.push({ minX: p4[0] - .25, maxX: p4[0] + .25, minZ: p4[1] - .25, maxZ: p4[1] + .25 });
  });
  for (let n = 0; n < poleTops.length - 1; n++) {        // fios entre postes
    const a = poleTops[n], b = poleTops[n + 1];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const wire = new THREE.Mesh(new THREE.BoxGeometry(.03, .03, len), wireP);
    wire.position.set((a[0] + b[0])/2, 4.45, (a[1] + b[1])/2);
    wire.rotation.y = Math.atan2(b[0] - a[0], b[1] - a[1]);
    scene.add(wire);
  }
  const rd = new THREE.Mesh(new THREE.PlaneGeometry(24, 5),
    new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: .16 }));
  rd.rotation.x = -Math.PI/2; rd.position.set(-100, .04, 0); scene.add(rd);
}

/* ── glow sprite helper ── */
function glowSprite(color, size) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const gr = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, color); gr.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.set(size, size, 1);
  return s;
}
function blobShadow(r) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const gr = x.createRadialGradient(32, 32, 4, 32, 32, 30);
  gr.addColorStop(0, "rgba(0,0,0,.5)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(r, r), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI/2; m.position.y = .04;
  m.userData.noShadow = true;
  return m;
}
/* poça de luz no chão molhado (aditiva) */
function flatGlow(color, size, opacity) {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const gr = x.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, color); gr.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false }));

/* ── animação do ambiente (chamada todo frame) ── */
let _flickT = 0;
function updateAmbience(dt, t) {
  // chuva
  if (rain.p.visible) {
    rain.p.position.set(G.pos.x, 0, G.pos.z);
    const a = rain.pos;
    for (let i = 0; i < rain.N; i++) {
      a[i*3+1] -= rain.vel[i]*dt;
      if (a[i*3+1] < 0) {
        a[i*3+1] = 24 + Math.random()*3;
        a[i*3] = (Math.random()*2 - 1)*30; a[i*3+2] = (Math.random()*2 - 1)*30;
      }
    }
    rain.geo.attributes.position.needsUpdate = true;
  }
  // fogo dos carros
  for (const f of fires) {
    for (const p of f.parts) {
      p.ph += dt * p.sp; if (p.ph > 1) p.ph -= 1;
      const wob = Math.sin((p.ph + p.sp) * 6.28) * p.r * (p.smoke ? 1.6 : .7);
      p.s.position.set(f.x + wob, f.y + p.ph * (p.smoke ? 3 : 1.6), f.z);
      const sc = p.smoke ? .9 + p.ph*1.8 : 1.3*(1 - p.ph) + .25;
      p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = p.smoke ? .3*(1 - p.ph) : (1 - p.ph)*.95;
    }
    f.light.intensity = 1 + Math.random()*.7;
  }
  // letreiros neon piscando
  for (const sg of signs) {
    sg.next -= dt;
    if (sg.next <= 0) {
      sg.on = !sg.on;
      sg.m.opacity = sg.on ? .95 : .1;
      sg.next = sg.on ? .8 + Math.random()*3.5 : .05 + Math.random()*.3;
    }
  }
  // luzes vermelhas das antenas
  for (const b of blinkers) b.s.material.opacity = Math.sin(t*2.2 + b.ph) > .1 ? .9 : .06;
  // fluxos de dados
  for (const st of streams) {
    if (!st.m.visible) continue;
    st.m.position.y += st.sp * dt;
    if (st.m.position.y > st.h + 3) st.m.position.y = 0;
  }
  // janelas tremeluzindo (relativo ao clima da epoch)
  _flickT -= dt;
  if (_flickT <= 0) {
    _flickT = .4;
    for (let n = 0; n < 3; n++) {
      const b = buildings[(Math.random()*buildings.length)|0];
      const m = b && b.userData.fadeMats && b.userData.fadeMats[0];
      if (m && m.emissiveMap) m.emissiveIntensity = AMB.winI * (.8 + Math.random()*.45);
    }
  }
  // espuma do mar indo e voltando
  for (const wv of seaWaves) {
    wv.m.position.z = wv.base + Math.sin(t*.8 + wv.ph)*1.6;
    wv.m.material.opacity = .2 + Math.abs(Math.sin(t*.8 + wv.ph))*.18;
  }
  // barquinho balançando nas ondas
  if (seaBoat) {
    seaBoat.position.y = .05 + Math.sin(t*.9)*.14;
    seaBoat.rotation.z = Math.sin(t*.7)*.06;
    seaBoat.rotation.x = Math.sin(t*.55 + 1)*.04;
  }
  // vagalumes vagando na mata (piscam e derivam devagar)
  for (const f of fireflies) {
    f.s.position.x = f.x + Math.sin(t*f.sp + f.ph)*2.2;
    f.s.position.z = f.z + Math.cos(t*f.sp*.8 + f.ph)*2.2;
    f.s.position.y = 1.2 + Math.sin(t*f.sp*1.4 + f.ph)*.5;
    f.s.material.opacity = .3 + Math.abs(Math.sin(t*1.6 + f.ph))*.6;
  }
  // tempestade: relâmpago + trovão
  if (AMB.storm && G.state === "play") {
    _boltT -= dt;
    if (_boltT <= 0) {
      _boltT = 5 + Math.random()*9;
      const bolt = document.getElementById("bolt");
      bolt.style.transition = "none"; bolt.style.opacity = .85;
      requestAnimationFrame(() => { bolt.style.transition = "opacity .45s"; bolt.style.opacity = 0; });
      dirLight.intensity = 2.8;
      setTimeout(() => { dirLight.intensity = AMB.dI; }, 140);
      setTimeout(() => SFX.thunder(), 250 + Math.random()*550);
      nVibe(50);
    }
  }
}

function insideBuilding(x, z, m) {
  m = m || 0;
  for (const c of colliders)
    if (x > c.minX - m && x < c.maxX + m && z > c.minZ - m && z < c.maxZ + m) return true;
  return false;
}
function randStreetPos(minDistFromPlayer, minDistFromKeeper) {
  for (let i = 0; i < 60; i++) {
    // 60% na cidade central, 40% nos distritos (periferia/condomínio/mata/praia/mar)
    let x, z;
    const zone = Math.random();
    if (zone < .6)      { x = (Math.random()*2 - 1)*(BOUND - 6); z = (Math.random()*2 - 1)*(BZ - 6); }
    else if (zone < .7) { x = -(96 + Math.random()*38); z = (Math.random()*2 - 1)*(BZ - 6); }   // periferia
    else if (zone < .8) { x =  (96 + Math.random()*38); z = (Math.random()*2 - 1)*(BZ - 6); }   // condomínio
    else if (zone < .9) { x = (Math.random()*2 - 1)*(BX - 10); z = -(96 + Math.random()*38); }  // mata
    else                { x = (Math.random()*2 - 1)*(BX - 10); z =  (96 + Math.random()*38); }  // praia/mar
    if (insideBuilding(x, z, 1.2)) continue;
    if (Math.hypot(x - G.pos.x, z - G.pos.z) < (minDistFromPlayer || 0)) continue;
    if (Math.hypot(x - keeperPos.x, z - keeperPos.z) < (minDistFromKeeper || 8)) continue;
    return new THREE.Vector3(x, 0, z);
  }
  // fallback: borda da praça central — garantidamente livre de prédios
  return new THREE.Vector3(0, 0, 12);
}
function spawnBlock(nearPos) {
  let p = nearPos ? nearPos.clone().add(new THREE.Vector3((Math.random()-.5)*8, 0, (Math.random()-.5)*8)) : randStreetPos(10, 10);
  if (insideBuilding(p.x, p.z, 1) || Math.abs(p.x) > BOUND || Math.abs(p.z) > BOUND) p = randStreetPos(10, 10);
  const m = new THREE.Mesh(blockG, redBlockM);
  m.castShadow = true;
  m.position.set(p.x, 1, p.z);
  const spr = glowSprite("rgba(255,50,60,.6)", 2.4);
  spr.position.copy(m.position);
  scene.add(m); scene.add(spr);
  fieldBlocks.push({ g: m, spr, pos: p });
}
function spawnHunter(boss) {

const WEAPON_POSE = {

    m.position.set(x, y, z); g.add(m); return m;
  };
  const STEEL = 0xc8d4e8, WOOD = 0x4a3320, GUN = 0x252a36;
  if (type === "knife") {
    B(.05, .34, .1, STEEL, 0, .22, 0, 0x88aaff, .25);

    B(.07, .2, .07, WOOD, 0, -.1, 0);

function killHunter(h) {
  h.hp--;
  burst(h.g.position.clone().setY(1.4), 0xff5533, 10);
  if (h.hp > 0) {                                        // boss aguenta mais golpes
    SFX.hit(); nVibe(40);
    h.pos.x += (h.pos.x - G.pos.x) * .15; h.pos.z += (h.pos.z - G.pos.z) * .15;  // recuo
    return;
  }
  burst(h.g.position.clone().setY(1.2), 0x39ff14, 14);
  scene.remove(h.g);
  hunters.splice(hunters.indexOf(h), 1);
  popup(tt("kill_nack"), "#ffb35c");
  SFX.kill(); nVibe(70);
  G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  if (Math.random() < .35) spawnBlock(h.pos);            // Nack derrotado pode dropar bloco
  const rid = G.roundId, boss = h.boss;
  setTimeout(() => {                                      // respawn mantém a pressão
    if (G.state === "play" && G.roundId === rid) spawnHunter(boss);
  }, 9000);
  hud();
}
function doAttack() {
  if (G.state !== "play" || !G.weapon || G.atkAnim > 0) return;
  if (G.mission && G.mission.phase === "drive") return;   // mãos no volante!
  const w = WEAPONS[G.weapon.type];
  G.atkAnim = .28;
  const fx = Math.sin(G.heading), fz = Math.cos(G.heading);
  if (w.melee) {
    SFX.slash(); nVibe(25);
    let hitAny = false;
    for (let i = hunters.length - 1; i >= 0; i--) {
      const h = hunters[i];
      const dx = h.pos.x - G.pos.x, dz = h.pos.z - G.pos.z;
      const d = Math.hypot(dx, dz);
      if (d < w.range && (dx*fx + dz*fz) / (d || 1) > .2) { killHunter(h); hitAny = true; }
    }
    if (hitAny) G.invuln = Math.max(G.invuln, .4);       // golpe conectado dá um respiro
  } else {
    SFX.shoot(); nVibe(20);
    const m = new THREE.Mesh(new THREE.BoxGeometry(.1, .06, .38),
      new THREE.MeshBasicMaterial({ color: 0xffd24a }));
    m.position.set(G.pos.x + fx*.7, 1.25, G.pos.z + fz*.7);
    m.rotation.y = G.heading;
    scene.add(m);
    projectiles.push({ m, vx: fx*26, vz: fz*26, life: 1.1 });
  }
  G.weapon.uses--;
  if (G.weapon.uses <= 0) loseWeapon(w.melee ? "wpn_broke" : "wpn_empty");
  else updateWeaponHud();
}

function spawnMission() {
  const carPos = randStreetPos(18, 16);
  // prêmio no canto mais distante do táxi — uma travessia de verdade
  let best = [BOUND - 10, BOUND - 10], bd = -1;
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(c => {
    const tx = c[0]*(BX - 14), tz = c[1]*(BOUND - 10);   // cantos da faixa da cidade
    const d = Math.hypot(tx - carPos.x, tz - carPos.z);
    if (d > bd) { bd = d; best = [tx, tz]; }
  });
  const prizePos = new THREE.Vector3(best[0], 0, best[1]);
  for (let i = 0; i < 50 && insideBuilding(prizePos.x, prizePos.z, 1.5); i++) {
    prizePos.x = best[0] + (Math.random()-.5)*18;
    prizePos.z = best[1] + (Math.random()-.5)*18;
  }
  const carG = vehicleModel("taxi");
  carG.position.copy(carPos);
  carG.rotation.y = Math.random()*6.28;
  scene.add(carG);
  const carSpr = glowSprite("rgba(255,210,60,.75)", 4.5);
  carSpr.position.set(carPos.x, 1.2, carPos.z);
  scene.add(carSpr);
  const prizeG = makePrize();
  prizeG.position.copy(prizePos);
  scene.add(prizeG);
  G.mission = { phase: "pickup", carPos, carG, carSpr, prizePos, prizeG, hp: 2 };
}
function clearMission() {
  if (!G.mission) return;
  if (G.mission.carG)   { scene.remove(G.mission.carG); scene.remove(G.mission.carSpr); }
  if (G.mission.prizeG) scene.remove(G.mission.prizeG);
  G.mission = null;
}
function failMission() {
  if (!G.mission) return;
  if (G.mission.prizeG) scene.remove(G.mission.prizeG);

  popup(tt("mission_fail"), "#ff9d6b");
}
function completeMission() {
  const m = G.mission;
  scene.remove(m.prizeG);
  G.mission = null;
  // prêmio: WP bônus (respeita o teto diário) + blocos já verificados + escudo
  const room = Math.max(0, WP_DAILY_CAP - getAckiToday());
  const wpBonus = Math.min(5, room);
  if (wpBonus > 0) {
    creditWP(wpBonus, LANG === "pt" ? "Acki City — Missão do táxi" : "Acki City — Taxi mission");
    G.wpSession += wpBonus;
  }
  for (let i = 0; i < 2 && G.carried < G.carryMax; i++) {
    const cm = new THREE.Mesh(blockG, greenBlockM);
    cm.castShadow = true;
    scene.add(cm); carriedMeshes.push(cm);

const mmC = document.getElementById("minimap");
const mmX = mmC.getContext("2d");
function drawMinimap() {
  const W = mmC.width, H = mmC.height;
  // escala em z usa o mundo TODO (WZ ±140) — senão praia e mata ficam fora do mapa
  const sx2 = W / (BX*2 + 16), sz2 = H / (WZ*2 + 16);
  const px = (x) => W/2 + x*sx2, pz = (z) => H/2 + z*sz2;
  mmX.clearRect(0, 0, W, H);
  // zonas: mata (norte), praia+mar (sul), periferia (oeste), condomínio (leste)
  mmX.fillStyle = "rgba(30,80,42,.35)";   mmX.fillRect(0, 0, W, pz(-94));
  mmX.fillStyle = "rgba(160,140,90,.3)";  mmX.fillRect(0, pz(94), W, pz(SEA_Z) - pz(94));
  mmX.fillStyle = "rgba(30,90,150,.4)";   mmX.fillRect(0, pz(SEA_Z), W, H - pz(SEA_Z));
  mmX.fillStyle = "rgba(122,74,58,.3)";   mmX.fillRect(0, pz(-94), px(-94), pz(94) - pz(-94));
  mmX.fillStyle = "rgba(46,110,74,.3)";   mmX.fillRect(px(94), pz(-94), W - px(94), pz(94) - pz(-94));
  const dot = (x, z, c, r) => { mmX.fillStyle = c; mmX.beginPath(); mmX.arc(px(x), pz(z), r, 0, 7); mmX.fill(); };
  dot(0, 0, "#37d67a", 4);                                              // Block Keeper
  for (const b of fieldBlocks)  dot(b.pos.x, b.pos.z, "#ff4b4b", 2.4);  // blocos
  for (const w of fieldWeapons) dot(w.pos.x, w.pos.z, "#6db8ff", 2.4);  // armas
  for (const it of fieldItems)  dot(it.pos.x, it.pos.z, it.kind === "burger" ? "#f2a60a" : "#55ffee", 2.4); // itens
  for (const h of hunters)      dot(h.pos.x, h.pos.z, "#8a1f1f", 2);    // Nacks
  if (G.mission && Math.floor(performance.now()/300) % 2 === 0) {       // missão (pisca)
    const mp = G.mission.phase === "pickup" ? G.mission.carPos : G.mission.prizePos;
    dot(mp.x, mp.z, "#ffd400", 4);
  }
  // Acki com direção
  mmX.fillStyle = "#fff"; mmX.beginPath(); mmX.arc(px(G.pos.x), pz(G.pos.z), 3, 0, 7); mmX.fill();
  mmX.strokeStyle = "#fff"; mmX.lineWidth = 1.5; mmX.beginPath();
  mmX.moveTo(px(G.pos.x), pz(G.pos.z));
  mmX.lineTo(px(G.pos.x) + Math.sin(G.heading)*7, pz(G.pos.z) + Math.cos(G.heading)*7);
  mmX.stroke();
}

    x.beginPath(); x.moveTo(48, 35); x.lineTo(60, 46); x.lineTo(52, 50); x.lineTo(45, 35); x.closePath(); x.fill();
    x.fillRect(22, 35, 7, 12);
    x.fillRect(10, 22, 12, 6);
  }
  _wpnIcons[type] = c.toDataURL();
  return _wpnIcons[type];
}

/* ═══════════════ FÍSICA / COLISÃO ═══════════════ */
function collide(p, r) {
  for (const c of colliders) {
    const nx = Math.max(c.minX, Math.min(p.x, c.maxX));
    const nz = Math.max(c.minZ, Math.min(p.z, c.maxZ));
    const dx = p.x - nx, dz = p.z - nz;
    const d2 = dx*dx + dz*dz;
    if (d2 < r*r) {
      if (d2 > 1e-6) {
        const d = Math.sqrt(d2);
        p.x = nx + dx/d * r; p.z = nz + dz/d * r;
      } else {
        // dentro do AABB: empurra pelo eixo de menor penetração
        const pl = p.x - c.minX, pr = c.maxX - p.x, pt = p.z - c.minZ, pb = c.maxZ - p.z;
        const m = Math.min(pl, pr, pt, pb);
        if (m === pl) p.x = c.minX - r; else if (m === pr) p.x = c.maxX + r;
        else if (m === pt) p.z = c.minZ - r; else p.z = c.maxZ + r;
      }
    }
  }
  p.x = Math.max(-BX, Math.min(BX, p.x));
  p.z = Math.max(-WZ, Math.min(WZ, p.z));
}

/* ── oclusão: prédio entre a câmera e a Acki fica transparente ── */
const occRay = new THREE.Raycaster();
const occTarget = new THREE.Vector3(), occDir = new THREE.Vector3();
function updateOcclusion() {
  // raio parte da Acki em direção à câmera (a câmera pode estar DENTRO de
  // um prédio — raio de dentro pra fora não registra as faces frontais)
  occTarget.set(G.pos.x, 1.4, G.pos.z);
  occDir.copy(camera.position).sub(occTarget);
  const dist = occDir.length();
  occDir.normalize();
  occRay.set(occTarget, occDir);
  occRay.far = dist;
  const hits = occRay.intersectObjects(buildings, false);
  const blocking = new Set();
  for (const h of hits) blocking.add(h.object);
  for (const b of buildings) {
    const mats = b.userData.fadeMats || (b.userData.fadeMats = Array.isArray(b.material) ? b.material : [b.material]);
    const hit = blocking.has(b);
    for (const m of mats) {
      if (hit) {
        if (!m.transparent) { m.transparent = true; m.needsUpdate = true; }
        m.opacity += (0.16 - m.opacity) * 0.3;
      } else if (m.transparent) {
        m.opacity += (1 - m.opacity) * 0.12;
        if (m.opacity > 0.98) { m.opacity = 1; m.transparent = false; m.needsUpdate = true; }
      }
    }
  }
}

/* ═══════════════ LOOP ═══════════════ */
let lastT = performance.now(), fpsAcc = 0, fpsN = 0, quality = 2;
function applyQuality() {
  renderer.setPixelRatio(quality === 2 ? Math.min(window.devicePixelRatio || 1, 1.6) : quality === 1 ? 1.15 : 1);
  dirLight.castShadow = quality === 2;
  rain.p.visible = AMB.rain && quality >= 1;
  streams.forEach(s => s.m.visible = quality >= 1);
  scene.fog.far = AMB.fogF * (quality === 2 ? 1 : quality === 1 ? .8 : .62);
}
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.05, (now - lastT)/1000);
  lastT = now;

  // ambiente sempre animado
  const t = now/1000;
  floaters.forEach((f, i) => { f.rotation.y += dt*.3; f.position.y += Math.sin(t*.7 + i)*dt*.6; });
  if (window._keeperBot) {
    window._keeperBot.position.y = .2 + Math.sin(t*1.6)*.12;
    const kud = window._keeperBot.userData;
    if (kud.armL) {                                       // Keeper acena de leve
      kud.armL.rotation.x = Math.sin(t*2)*.3;
      kud.armR.rotation.x = -Math.sin(t*2)*.3;
      kud.core.material.emissiveIntensity = .7 + Math.sin(t*3)*.3;
    }
  }
  updateAmbience(dt, t);
  // sol/lua de sombras acompanha a Acki (frustum apertado = sombra nítida)
  dirLight.position.set(G.pos.x + 16, 32, G.pos.z + 10);
  dirLight.target.position.set(G.pos.x, 0, G.pos.z);

  if (G.state === "play") update(dt, t);

  // camera
  const px = G.pos.x, pz = G.pos.z;
  const shake = G.shake > 0 ? G.shake : 0;
  G.shake = Math.max(0, G.shake - dt*2);
  const sx = (Math.random()-.5)*shake, sy = (Math.random()-.5)*shake;
  // câmera rasteira automática: dash ou veículo rápido (carro/moto/táxi/jet
  // ski) dão a sensação de velocidade; a pé ou de skate/bike fica na altura
  // normal (tática, dá pra ver Nacki e blocos chegando de longe)
  const lowTarget = (G.dashT > 0 || (G.vehicle && VEHICLES[G.vehicle.type].mult >= 1.8)) ? 1 : 0;
  G.camLowT += (lowTarget - G.camLowT) * Math.min(1, dt*3.5);
  const camH2   = G.camH   - G.camLowT * 6.7;   // 9 → 2.3
  const camDist2 = G.camDist - G.camLowT * 3.3; // 8.5 → 5.2 (mais perto, mais velocidade)
  camera.position.set(
    px + Math.sin(G.camYaw)*camDist2 + sx,
    camH2 + sy,
    pz + Math.cos(G.camYaw)*camDist2
  );
  camera.lookAt(px, 1.7 - G.camLowT*.9, pz);
  updateOcclusion();

  // auto-degrade de qualidade (2=tudo, 1=sem sombras/chuva leve, 0=mínimo)
  fpsAcc += dt; fpsN++;
  if (fpsAcc > 4) {
    const fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0;
    if (fps < 34 && quality > 0) { quality--; applyQuality(); }
  }
  renderer.render(scene, camera);
}

function update(dt, t) {
  /* ── movimento: CORRER (sempre pra frente) + virar arrastando ── */
  if (keys[" "]) { doDash(); keys[" "] = false; }
  if (keys.a || keys.arrowleft)  G.heading += dt*2.8;
  if (keys.d || keys.arrowright) G.heading -= dt*2.8;
  G.dashT = Math.max(0, G.dashT - dt);
  G.dashCd = Math.max(0, G.dashCd - dt);
  $("dashBtn").className = G.dashCd > 0 ? "cd" : "";
  const running = runHeld || keys.w || keys.arrowup || G.dashT > 0;
  const mag = running ? 1 : 0;
  // água: sem jet ski anda-se devagar (vau); jet ski voa no mar e se arrasta na areia
  const inWater = G.pos.z > SEA_Z;
  const onJetski = G.vehicle && G.vehicle.type === "jetski";
  const envMult = inWater ? (onJetski ? 1 : .42) : (onJetski ? .5 : 1);
  const spd = G.speed * (G.dashT > 0 ? 2.3 : 1) * (G.vehicle ? VEHICLES[G.vehicle.type].mult : 1) * (G.burgerT > 0 ? 1.3 : 1) * envMult;
  if (running) {
    G.pos.x += Math.sin(G.heading)*spd*dt;
    G.pos.z += Math.cos(G.heading)*spd*dt;
    G.runPhase += dt * (G.dashT > 0 ? 16 : 10);
  } else {
    G.runPhase += dt*2;
  }
  // câmera cola atrás da Acki — "pra frente" é sempre pra cima da tela
  let dyaw = (G.heading + Math.PI) - G.camYaw;
  while (dyaw > Math.PI) dyaw -= Math.PI*2; while (dyaw < -Math.PI) dyaw += Math.PI*2;
  G.camYaw += dyaw * Math.min(1, dt*5);
  collide(G.pos, .55);

  /* ── anima Acki ── */
  const pg = player.group;
  pg.position.set(G.pos.x, 0, G.pos.z);
  pg.rotation.y = G.heading;
  const swing = Math.sin(G.runPhase) * (mag > .12 && !G.vehicle ? .75 : .06);
  player.legL.rotation.x = swing; player.legR.rotation.x = -swing;
  player.armL.rotation.x = -swing*.8; player.armR.rotation.x = swing*.8;
  /* pose no veículo: mãos no guidão/volante, pernas dobradas */
  if (G.vehicle) {
    const vt2 = G.vehicle.type;
    if (vt2 === "bike" || vt2 === "moto" || vt2 === "jetski") {
      player.armL.rotation.x = -1.2;  player.armR.rotation.x = -1.2;
      player.armL.rotation.z = .28;   player.armR.rotation.z = -.28;
      player.legL.rotation.x = -.55;  player.legR.rotation.x = -.55;
    } else if (vt2 === "carro" || vt2 === "taxi") {
      player.armL.rotation.x = -.95;  player.armR.rotation.x = -.95;
      player.armL.rotation.z = .12;   player.armR.rotation.z = -.12;
      player.legL.rotation.x = -.7;   player.legR.rotation.x = -.7;
    } else {                                              // skate/patins: braços abertos
      player.armL.rotation.z = .5;    player.armR.rotation.z = -.5;
    }
  } else {
    player.armL.rotation.z = 0; player.armR.rotation.z = 0;
  }
  if (G.atkAnim > 0) {                                    // golpe: braço direito ataca
    G.atkAnim -= dt;
    player.armR.rotation.x = -2.4 * Math.sin(Math.PI * Math.max(0, G.atkAnim) / .28);
  }
  player.tailL.rotation.z = .15 + Math.sin(G.runPhase*.9)*.18;
  player.tailR.rotation.z = -.15 - Math.sin(G.runPhase*.9 + 1)*.18;
  pg.position.y = Math.abs(Math.sin(G.runPhase)) * (mag > .12 ? .09 : .02);
  if (G.invuln > 0) {
    G.invuln -= dt;
    pg.visible = Math.floor(t*12) % 2 === 0;
  } else pg.visible = true;

  /* ── piscar de olhos (vida no rosto) ── */
  if (G.blinkDur > 0) {
    G.blinkDur -= dt;
    if (G.blinkDur <= 0) { player.faceM.map = player.texOpen; player.faceM.needsUpdate = true; }
  } else {
    G.blinkT -= dt;
    if (G.blinkT <= 0) {
      G.blinkT = 2.2 + Math.random()*3;
      G.blinkDur = .13;
      player.faceM.map = player.texClosed; player.faceM.needsUpdate = true;
    }
  }

  /* ── blocos carregados (pilha na cabeça) ── */
  carriedMeshes.forEach((m, i) => {
    m.position.set(G.pos.x, 2.5 + i*.7 + Math.sin(t*3 + i)*.06, G.pos.z);
    m.rotation.y += dt*2;
  });

  /* ── armas no chão: animação + coleta ── */
  for (let i = fieldWeapons.length - 1; i >= 0; i--) {
    const wp = fieldWeapons[i];
    wp.g.rotation.y += dt*2.5;
    wp.g.position.y = 1 + Math.sin(t*2.6 + i)*.15;
    wp.spr.position.y = wp.g.position.y + .2;
    if (Math.hypot(wp.pos.x - G.pos.x, wp.pos.z - G.pos.z) < 1.5) {
      scene.remove(wp.g); scene.remove(wp.spr);
      fieldWeapons.splice(i, 1);
      equipWeapon(wp.type);
    }
  }
  /* ── projéteis (pistola/fuzil) ── */
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.m.position.x += p.vx*dt; p.m.position.z += p.vz*dt;
    p.life -= dt;
    let dead = p.life <= 0 || insideBuilding(p.m.position.x, p.m.position.z, 0);
    if (!dead) for (const h of hunters) {
      if (Math.hypot(h.pos.x - p.m.position.x, h.pos.z - p.m.position.z) < 1.1) {
        killHunter(h); dead = true; break;
      }
    }
    if (dead) { scene.remove(p.m); projectiles.splice(i, 1); }
  }
  /* ── itens no chão: escudo e veículos ── */
  for (let i = fieldItems.length - 1; i >= 0; i--) {
    const it = fieldItems[i];
    it.g.rotation.y += dt*2;
    it.g.position.y = 1 + Math.sin(t*2.4 + i)*.15;
    it.spr.position.y = it.g.position.y + .2;
    if (Math.hypot(it.pos.x - G.pos.x, it.pos.z - G.pos.z) < 1.6) {
      scene.remove(it.g); scene.remove(it.spr);
      fieldItems.splice(i, 1);
      if (it.kind === "shield") {
        G.shieldT = 8;
        popup(tt("shield_get"), "#7dd8ff");
        SFX.shield(); nVibe(45);
      } else if (it.kind === "burger") {
        G.burgerT = 10;                                  // 🍔 = +30% de velocidade
        popup(tt("burger_get"), "#ffb44a");
        SFX.equip(); nVibe(35);
      } else mountVehicle(it.kind);
    }
  }
  /* ── escudo ativo: bolha pulsando (pisca quando está acabando) ── */
  if (G.shieldT > 0) {
    G.shieldT -= dt;
    shieldMesh.visible = true;
    const ps = 1 + Math.sin(t*6)*.05;
    shieldMesh.scale.set(ps, ps, ps);
    shieldMesh.material.opacity = .14 + Math.sin(t*5)*.05 + (G.shieldT < 2 ? Math.abs(Math.sin(t*16))*.1 : 0);
    if (G.shieldT <= 0) { shieldMesh.visible = false; hint(tt("shield_end"), 1500); }
  }
  /* ── veículo/hambúrguer: contagem + HUD ── */
  if (G.burgerT > 0) G.burgerT -= dt;
  if (G.vehicle) {
    G.vehicle.t -= dt;
    $("vehTag").textContent = tt(VEHICLES[G.vehicle.type].name) + " ⚡ " + Math.max(0, Math.ceil(G.vehicle.t)) + "s";
    if (G.vehicle.t <= 0) unmountVehicle(false);
  } else if (G.burgerT > 0) {
    $("vehTag").textContent = tt("burger_tag") + " " + Math.ceil(G.burgerT) + "s";
  } else if ($("vehTag").textContent) {
    $("vehTag").textContent = "";
  }
  /* ── missão do táxi ── */
  if (G.mission) {
    const m = G.mission;
    if (m.phase === "pickup") {
      m.carG.position.y = Math.abs(Math.sin(t*2))*.04;
      m.carSpr.material.opacity = .5 + Math.sin(t*5)*.3;
      if (Math.hypot(m.carPos.x - G.pos.x, m.carPos.z - G.pos.z) < 2.4) {
        scene.remove(m.carG); scene.remove(m.carSpr); m.carG = null;
        m.phase = "drive";
        mountVehicle("taxi");
        G.vehicle.t = 9999;                              // sem prazo — dura a missão
        popup(tt("mission_start"), "#ffd400");
        hint(tt("mission_hint"), 4200);
      }
    } else {
      m.prizeG.rotation.y += dt*1.4;
      if (!G.vehicle) failMission();                     // perdeu o táxi = perdeu a missão
      else if (Math.hypot(m.prizePos.x - G.pos.x, m.prizePos.z - G.pos.z) < 4) completeMission();
    }
  }
  /* ── minimapa (throttle ~7fps) ── */
  _mmT -= dt;
  if (_mmT <= 0) { _mmT = .15; drawMinimap(); }

  /* ── verificação de bloco ── */
  let near = null, nd = 2.4;
  for (const b of fieldBlocks) {
    const d = Math.hypot(b.pos.x - G.pos.x, b.pos.z - G.pos.z);
    if (d < nd) { nd = d; near = b; }
  }
  if (near && G.carried < G.carryMax && !(G.mission && G.mission.phase === "drive")) {
    if (G.verifyTarget !== near) { G.verifyTarget = near; G.verifyProg = 0; }
    G.verifyProg += dt / .95;
    $("verifyWrap").style.display = "block";
    $("verifyRing").style.background = `conic-gradient(#37d67a ${Math.min(1,G.verifyProg)*360}deg, rgba(255,255,255,.12) 0deg)`;
    if (Math.random() < dt*6) SFX.verify();
    if (G.verifyProg >= 1) {
      // ACK! bloco vira verde e é carregado
      scene.remove(near.g); scene.remove(near.spr);
      fieldBlocks.splice(fieldBlocks.indexOf(near), 1);
      const cm = new THREE.Mesh(blockG, greenBlockM);
      cm.castShadow = true;
      scene.add(cm); carriedMeshes.push(cm);
      G.carried++;
      G.verifyTarget = null; G.verifyProg = 0;
      popup(T.ack, "#5dff9d"); SFX.ack(); nVibe(35);
      burst(new THREE.Vector3(G.pos.x, 1.4, G.pos.z), 0x5dff9d, 10);
      if (G.hintShown < 3) { hint(T.hint2, 3800); G.hintShown = 3; }
      hud();
    }
  } else {
    G.verifyTarget = null; G.verifyProg = 0;
    $("verifyWrap").style.display = "none";
  }

  /* ── entrega no Block Keeper ── */
  if (G.carried > 0 && Math.hypot(G.pos.x - keeperPos.x, G.pos.z - keeperPos.z) < 3.6) {
    G.delivered += G.carried;
    G.combo += G.carried;
    G.maxCombo = Math.max(G.maxCombo, G.combo);
    burst(new THREE.Vector3(0, 2, 0), 0x5dff9d, 8 + G.carried*6);
    carriedMeshes.forEach(m => scene.remove(m)); carriedMeshes.length = 0;
    G.carried = 0;
    popup(T.finalized, "#5dff9d"); SFX.deliver(); nVibe(60);
    // repõe blocos no mapa se ainda faltam
    while (G.delivered + G.carried + fieldBlocks.length < G.quota + 2 && fieldBlocks.length < 10) spawnBlock(null);
    hud();
    if (G.delivered >= G.quota) { winEpoch(); return; }
  }

  /* ── blocos no mapa: animação ── */
  fieldBlocks.forEach((b, i) => {
    b.g.position.y = 1 + Math.sin(t*2.4 + i)*.18;
    b.g.rotation.y += dt*1.8;
    b.spr.position.copy(b.g.position);
    const pulse = .8 + Math.sin(t*5 + i)*.25;
    b.spr.scale.set(2.4*pulse, 2.4*pulse, 1);
  });

  /* ── caçadores Nack ── */
  const aggro = 11;
  for (const h of hunters) {
    const d = Math.hypot(h.pos.x - G.pos.x, h.pos.z - G.pos.z);
    let tx, tz, sp;
    if (d < (h.boss ? 17 : aggro)) { tx = G.pos.x; tz = G.pos.z; sp = h.speed; }
    else {
      if (Math.hypot(h.pos.x - h.wp.x, h.pos.z - h.wp.z) < 2) h.wp = randStreetPos(0, 8);
      tx = h.wp.x; tz = h.wp.z; sp = h.speed*.45;
    }
    const dx = tx - h.pos.x, dz = tz - h.pos.z, dd = Math.hypot(dx, dz) || 1;
    if (h.pos.z > SEA_Z) sp *= .5;                       // Nackis nadam mal — o mar é refúgio
    h.pos.x += dx/dd*sp*dt; h.pos.z += dz/dd*sp*dt;
    collide(h.pos, .6);
    h.g.position.set(h.pos.x, Math.sin(t*3 + h.bob)*.15, h.pos.z);
    h.g.rotation.y = Math.atan2(dx, dz);
    // braços balançam (mais rápido na perseguição) + núcleo pulsando
    const ud = h.g.userData;
    if (ud.armL) {
      const sw2 = Math.sin(t*7 + h.bob) * (d < (h.boss ? 17 : aggro) ? .6 : .25);
      ud.armL.rotation.x = sw2; ud.armR.rotation.x = -sw2;
      ud.core.material.emissiveIntensity = .7 + Math.sin(t*5 + h.bob)*.35;
    }
    // hit
    if (d < 1.25 && G.invuln <= 0) {
      if (G.shieldT > 0) {
        // escudo repele o Nack — blocos protegidos
        const ax = (h.pos.x - G.pos.x)/(d || 1), az = (h.pos.z - G.pos.z)/(d || 1);
        h.pos.x += ax*3.5; h.pos.z += az*3.5;
        collide(h.pos, .6);
        burst(new THREE.Vector3(G.pos.x + ax, 1.2, G.pos.z + az), 0x66ddff, 6);
        SFX.verify(); nVibe(25);
      } else hitPlayer();
    }
  }

  /* ── seta-guia ── */
  let target = null;
  if (G.mission && G.mission.phase === "drive") { target = G.mission.prizePos; arrow.material.color.setHex(0xffd400); }
  else if (G.carried > 0) { target = keeperPos; arrow.material.color.setHex(0x5dff9d); }
  else if (fieldBlocks.length) {
    let bd = 1e9;
    for (const b of fieldBlocks) { const d = Math.hypot(b.pos.x - G.pos.x, b.pos.z - G.pos.z); if (d < bd) { bd = d; target = b.pos; } }
    arrow.material.color.setHex(0xff4b4b);
  }
  if (target) {
    arrowPivot.visible = true;
    arrowPivot.position.set(G.pos.x, 3 + Math.sin(t*3)*.15, G.pos.z);
    arrowPivot.rotation.y = Math.atan2(target.x - G.pos.x, target.z - G.pos.z);
  } else arrowPivot.visible = false;

  /* ── partículas ── */
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.m.position.addScaledVector(p.vel, dt);
    p.vel.y -= 9*dt;
    p.m.material.opacity = Math.max(0, p.life);
    p.m.lookAt(camera.position);
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); }
  }

  /* ── timer ── */
  G.timeLeft -= dt;
  if (G.timeLeft <= 10.5 && G.timeLeft + dt > 10.5) hint("⏰ 10s!", 1600);
  if (Math.ceil(G.timeLeft) !== Math.ceil(G.timeLeft + dt) && G.timeLeft < 10 && G.timeLeft > 0) SFX.tick();
  if (G.timeLeft <= 0) { failEpoch(); return; }
  hud();
}

function hitPlayer() {
  if (G.shieldT > 0) return;
  if (G.vehicle) {
    // táxi da missão aguenta 2 batidas antes de ser destruído
    if (G.mission && G.mission.phase === "drive" && G.mission.hp > 1) {
      G.mission.hp--;
      G.invuln = 1.6; G.shake = .5;
      SFX.hit(); nVibe(90);
      const fm = $("flash");
      fm.style.transition = "none"; fm.style.opacity = .5;
      requestAnimationFrame(() => { fm.style.transition = "opacity .5s"; fm.style.opacity = 0; });
      return;
    }
    // o veículo absorve o golpe: perde o veículo, mantém os blocos e o combo
    const wasMission = G.mission && G.mission.phase === "drive";
    unmountVehicle(true);
    if (wasMission) failMission();
    G.invuln = 1.6; G.shake = .5;
    SFX.hit(); nVibe(90);
    const fv = $("flash");
    fv.style.transition = "none"; fv.style.opacity = .6;
    requestAnimationFrame(() => { fv.style.transition = "opacity .5s"; fv.style.opacity = 0; });
    return;
  }
  G.invuln = 1.6; G.hits++; G.combo = 0; G.shake = .5;
  SFX.hit(); nVibe(120);
  const f = $("flash");
  f.style.transition = "none"; f.style.opacity = 1;
  requestAnimationFrame(() => { f.style.transition = "opacity .5s"; f.style.opacity = 0; });
  if (G.carried > 0) {
    // derruba blocos: voltam ao mapa como vermelhos perto do jogador
    for (let i = 0; i < G.carried; i++) spawnBlock(G.pos);
    carriedMeshes.forEach(m => scene.remove(m)); carriedMeshes.length = 0;
    G.carried = 0;
    popup(T.nack, "#ff5c5c");
  }
  if (G.hintShown < 4) { hint(T.hint3, 3200); G.hintShown = 4; }
  burst(new THREE.Vector3(G.pos.x, 1.2, G.pos.z), 0xff3b3b, 14);
  hud();
}

/* ── resize ── */
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ── boot ── */
window._dbg = { G, scene, camera, renderer, hunters, buildings, colliders, fieldBlocks, fieldWeapons, fieldItems, player, MODELS,
  mountVehicle, unmountVehicle, equipWeapon, vehicleModel, weaponModel, doAttack, spawnHunter };
applyStaticI18n();
showTitle();
const loadTag = document.getElementById("loadTag");
if (loadTag) loadTag.style.display = "none";
requestAnimationFrame(t => { lastT = t; tick(t); });

})().catch(e => {
  // Sem modelos ou sem WebGL: nunca deixa o jogador preso na tela de loading.
  const t2 = document.getElementById("loadTxt");
  if (t2) t2.textContent = "ERRO AO CARREGAR — " + (e && e.message ? e.message : e);
  console.error("Acki City boot error:", e);
});
</script>
