<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bee Engine Local</title>
    <style>
        html, body {
          margin: 0;
          padding: 0;
          background: #111;
          color: #fff;
          font-family: Arial, sans-serif;
        }

        .wrap {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          box-sizing: border-box;
        }

        .card {
          width: 100%;
          max-width: 760px;
          background: #1a1a1a;
          border: 1px solid #333;
          border-radius: 18px;
          padding: 24px;
          box-sizing: border-box;
        }

        h1 {
          margin-top: 0;
          color: #FFD54A;
        }

        p {
          color: #ddd;
        }

        .row {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          margin-top: 16px;
          margin-bottom: 16px;
        }

        button {
          background: #FFD54A;
          color: #111;
          border: none;
          padding: 12px 16px;
          border-radius: 12px;
          font-weight: bold;
          cursor: pointer;
        }

        pre {
          margin-top: 16px;
          background: #0d0d0d;
          padding: 14px;
          border-radius: 12px;
          white-space: pre-wrap;
          word-break: break-word;
          min-height: 180px;
          border: 1px solid #252525;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Bee Engine Local</h1>
        <p id="status">Carregando Bee local...</p>

        <div class="row">
            <button onclick="beePing()">Ping JS</button>
            <button onclick="beeAndroid()">Testar Android</button>
            <button onclick="testBeeSdk()">Testar SDK Real</button>
        </div>

        <pre id="log">Inicializando painel Bee...</pre>
    </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
